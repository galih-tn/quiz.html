function safeLSGet(key){let value=null;try{value=localStorage.getItem(key)}catch(e){}if(value!==null)return value;if(key===FALLBACK_KEY&&memoryRecords.length)return JSON.stringify(memoryRecords);if(key===ACTIVE_KEY&&memoryActive)return memoryActive;return null}
function safeLSSet(key,val){try{localStorage.setItem(key,val);if(key===FALLBACK_KEY){try{memoryRecords=JSON.parse(val)||[]}catch(e){}}if(key===ACTIVE_KEY)memoryActive=val;return true}catch(e){if(key===FALLBACK_KEY){try{memoryRecords=JSON.parse(val)||[]}catch(err){}dbMode='Session memory (not persistent)';return true}if(key===ACTIVE_KEY){memoryActive=val;dbMode='Session memory (not persistent)';return true}return false}}
function safeLSRemove(key){try{localStorage.removeItem(key)}catch(e){}if(key===ACTIVE_KEY)memoryActive=null;if(key===FALLBACK_KEY)memoryRecords=[]}
function esc(value){return String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalized(value){return String(value||'').normalize('NFKC').trim().toLocaleLowerCase('id-ID').replace(/\s+/g,' ')}
function participantId(name,media){return 'participant::'+encodeURIComponent(normalized(name))+'::'+encodeURIComponent(normalized(media))}
function showToast(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>toastEl.classList.remove('show'),3400)}
function fmtTime(ms, tenths=false){ms=Math.max(0,Math.floor(Number(ms)||0));let whole=Math.floor(ms/1000),m=Math.floor(whole/60),s=whole%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+(tenths?'.'+Math.floor((ms%1000)/100):'')}
function fmtDate(iso){try{return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}catch(e){return '-'}}
function sortRecords(records){return [...records].sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0)||(Number(a.elapsedMs)||0)-(Number(b.elapsedMs)||0)||String(a.completedAt||'').localeCompare(String(b.completedAt||''))||String(a.name||'').localeCompare(String(b.name||''),'id'))}
function compareBest(a,b){if(!a)return b;if(!b)return a;if((+b.score||0)>(+a.score||0))return b;if((+b.score||0)<(+a.score||0))return a;if((+b.elapsedMs||Infinity)<(+a.elapsedMs||Infinity))return b;return a}
function mergeById(records){const map=new Map();for(const r of records||[]){if(!r||!r.name||!r.media)continue;const id=participantId(r.name,r.media);const clean={...r,id,score:Math.max(0,Math.min(100,Number(r.score)||0)),elapsedMs:Math.max(0,Number(r.elapsedMs)||0),answers:Array.isArray(r.answers)?r.answers.slice(0,20):Array(20).fill(null)};while(clean.answers.length<20)clean.answers.push(null);map.set(id,map.has(id)?compareBest(map.get(id),clean):clean)}return [...map.values()]}
function readFallback(){try{const data=JSON.parse(safeLSGet(FALLBACK_KEY)||'[]');return Array.isArray(data)?data:[]}catch(e){return []}}
function writeFallback(records){return safeLSSet(FALLBACK_KEY,JSON.stringify(records))}
function idbRequest(request){return new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('IndexedDB request gagal'))})}
function openDB(){return new Promise(resolve=>{try{if(!('indexedDB'in window)){dbMode='Local Storage';resolve(false);return}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const database=req.result;if(!database.objectStoreNames.contains(STORE_NAME))database.createObjectStore(STORE_NAME,{keyPath:'id'})};req.onsuccess=()=>{db=req.result;dbMode='IndexedDB';db.onversionchange=()=>db.close();resolve(true)};req.onerror=()=>{db=null;dbMode='Local Storage';resolve(false)};req.onblocked=()=>{db=null;dbMode='Local Storage';resolve(false)}}catch(e){db=null;dbMode='Local Storage';resolve(false)}})}
async function getAllAttempts(){if(db){try{const tx=db.transaction(STORE_NAME,'readonly');const list=await idbRequest(tx.objectStore(STORE_NAME).getAll());return mergeById(list)}catch(e){db=null;dbMode='Local Storage'}}return mergeById(readFallback())}
async function saveRecord(record){if(db){try{await new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).put(record);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Gagal menyimpan'));tx.onabort=()=>reject(tx.error||new Error('Penyimpanan dibatalkan'))});return true}catch(e){db=null;dbMode='Local Storage'}}const list=readFallback();const idx=list.findIndex(x=>x.id===record.id);if(idx>=0)list[idx]=compareBest(list[idx],record);else list.push(record);return writeFallback(list)}
async function replaceAll(records){const clean=mergeById(records);if(db){try{await new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readwrite');const store=tx.objectStore(STORE_NAME);store.clear();clean.forEach(r=>store.put(r));tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Gagal mengimpor'));tx.onabort=()=>reject(tx.error||new Error('Impor dibatalkan'))});return clean.length}catch(e){db=null;dbMode='Local Storage'}}writeFallback(clean);return clean.length}
function loadActive(){try{const a=JSON.parse(safeLSGet(ACTIVE_KEY)||'null');if(a&&a.player&&Array.isArray(a.answers)&&a.answers.length===20&&a.id&&Number(a.startedAt))return a}catch(e){}return null}
function saveActive(){if(active)safeLSSet(ACTIVE_KEY,JSON.stringify(active))}
function clearActive(){active=null;safeLSRemove(ACTIVE_KEY)}
function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}}
function currentElapsed(){return active?Math.max(0,Date.now()-active.startedAt):0}
function timerTicker(){stopTimer();const update=()=>{const node=document.getElementById('timer-value');if(node&&active)node.textContent=fmtTime(currentElapsed())};update();timerHandle=setInterval(update,250)}

async function startQuiz(event){event.preventDefault();const name=document.getElementById('participant-name').value.trim();const media=document.getElementById('participant-media').value.trim();const err=document.getElementById('form-error');err.classList.remove('show');err.textContent='';if(name.length<2||media.length<2){err.textContent='Isi nama peserta dan media asal dengan minimal 2 karakter.';err.classList.add('show');return}const id=participantId(name,media);attempts=await getAllAttempts();const existing=attempts.find(a=>a.id===id);if(existing){currentRecord=existing;existingRecordView=true;showToast('Identitas ini sudah memiliki hasil. Quiz tidak dapat diulang dengan nama dan media yang sama.');goTo('results');return}active={id,player:{name,media},startedAt:Date.now(),answers:Array(20).fill(null),currentIndex:0};currentRecord=null;existingRecordView=false;saveActive();goTo('quiz')}
function getFeedback(q,chosen){const good=chosen===q.correct;return `<div class="feedback show ${good?'good':'bad'}"><strong>${good?'✓ Benar! +5 poin':'✕ Belum tepat · 0 poin'}</strong><p>${esc(q.why)}</p></div>`}
function renderQuiz(){
 if(!active){renderLanding();return}screen='quiz';const i=active.currentIndex;const q=questions[i];const chosen=active.answers[i];const answered=chosen!==null&&chosen!==undefined;const score=active.answers.reduce((sum,ans,idx)=>sum+(ans===questions[idx].correct?5:0),0);const progress=Math.round(((i+(answered?1:0))/20)*100);

 </section><aside class="side-card"><h3>Expedition status</h3><div class="side-stat-wrap"><div class="side-label">Current score</div><div class="score-number">${score}<small> / 100</small></div><div class="side-stat"><span>Answered</span><strong>${active.answers.filter(a=>a!==null&&a!==undefined).length}/20</strong></div></div><div class="timer-block"><div class="side-label">Time elapsed</div><div class="timer-value" id="timer-value">${fmtTime(currentElapsed())}</div><div class="subtle" style="color:#aebbaa;margin-top:5px">Timer terus berjalan</div></div><p class="side-help">Skor maksimal 100 poin. Leaderboard diurutkan berdasarkan skor tertinggi, lalu waktu tercepat.</p></aside></div>`;

function answerQuestion(choice){if(!active)return;const i=active.currentIndex;if(active.answers[i]!==null&&active.answers[i]!==undefined)return;active.answers[i]=choice;saveActive();renderQuiz()}
async function advanceQuestion(){if(!active)return;const i=active.currentIndex;if(active.answers[i]===null||active.answers[i]===undefined)return;if(i<19){active.currentIndex=i+1;saveActive();renderQuiz();return}await completeQuiz()}
async function completeQuiz(){if(!active)return;stopTimer();const score=active.answers.reduce((sum,ans,i)=>sum+(ans===questions[i].correct?5:0),0);const record={id:active.id,name:active.player.name,media:active.player.media,score,elapsedMs:currentElapsed(),answers:[...active.answers],startedAt:new Date(active.startedAt).toISOString(),completedAt:new Date().toISOString(),quizVersion:1};const ok=await saveRecord(record);if(!ok){showToast('Penyimpanan lokal gagal. Ekspor data mungkin tidak tersedia pada browser ini.')}currentRecord=record;existingRecordView=false;clearActive();attempts=await getAllAttempts();goTo('results')}

function gradeFor(score){if(score>=90)return ['WILD EXPERT','Pengetahuan Jimny kamu sangat solid. Tetap konfirmasi spesifikasi unit dan utamakan keselamatan saat test drive.'];if(score>=75)return ['TRAIL READY','Fondasi pengetahuanmu sudah kuat. Lanjutkan eksplorasi fitur secara bertanggung jawab.'];if(score>=55)return ['ADVENTURE SEEKER','Kamu sudah punya modal yang baik. Review jawaban untuk menguatkan beberapa detail.'];return ['TRAIL ROOKIE','Awal petualangan yang bagus. Gunakan review jawaban untuk mempelajari kembali fitur dan karakter Jimny.']}
function renderResults(){stopTimer();if(!currentRecord){renderLanding();return}screen='results';const r=currentRecord;const [grade,desc]=gradeFor(r.score);const rank=rankOf(r);const correct=r.answers.reduce((sum,a,i)=>sum+(a===questions[i].correct?1:0),0);const note=existingRecordView?'<div class="notice"><strong>Hasil sudah tersimpan.</strong> Identitas nama dan media ini tidak bisa digunakan untuk memulai attempt baru di database lokal ini.</div>':'';
 app.innerHTML=`<section class="result-hero"><div><p class="result-kicker">${existingRecordView?'Saved result':'Quiz completed'} · Jimny Smart Quiz</p><h1>${esc(grade)}</h1><p class="result-desc">${esc(desc)}<br><span style="color:#fff;font-weight:750">${esc(r.name)}</span> · ${esc(r.media)}</p><div class="result-meta"><span class="pill">${correct} / 20 benar</span><span class="pill">Waktu ${fmtTime(r.elapsedMs)}</span><span class="pill">Rank #${rank}</span></div></div><div class="result-score-box"><div class="result-score">${r.score}<small> / 100</small></div><p style="color:#cfdbcb;margin:12px 0 0">Total poin akhir</p></div></section>
 <div class="result-grid"><div class="result-stat"><span>Jawaban benar</span><strong>${correct} / 20</strong></div><div class="result-stat"><span>Waktu penyelesaian</span><strong>${fmtTime(r.elapsedMs)}</strong></div><div class="result-stat"><span>Posisi leaderboard saat ini</span><strong>#${rank}</strong></div></div>
 <div class="result-actions"><button id="review-answers" class="btn btn-primary">REVIEW ANSWERS ↗</button><button id="results-leaderboard" class="btn btn-dark">LIHAT LEADERBOARD</button></div>${note}<div class="notice">Quiz ini tidak menyediakan tombol untuk mengulang. Penyimpanan file ini bersifat lokal pada browser/perangkat. Untuk leaderboard otomatis yang sama di semua perangkat, perlu database server dan koneksi saat sinkronisasi.</div>`;
 document.getElementById('review-answers').addEventListener('click',()=>goTo('review'));document.getElementById('results-leaderboard').addEventListener('click',()=>{screenBeforeBoard='results';goTo('leaderboard')});
}
function renderReview(){stopTimer();if(!currentRecord){renderLanding();return}screen='review';const r=currentRecord;const correct=r.answers.reduce((sum,a,i)=>sum+(a===questions[i].correct?1:0),0);app.innerHTML=`<section class="panel"><div class="panel-head"><div><p class="section-kicker">Answer breakdown</p><h2>Review answers</h2><p class="review-summary">${esc(r.name)} · ${esc(r.media)} · Skor ${r.score}/100 · ${correct}/20 jawaban benar</p></div><span class="db-chip">Attempt tersimpan</span></div><div class="review-list">${questions.map((q,i)=>{const answer=r.answers[i];const got=answer===q.correct;const your=answer===null||answer===undefined?'Tidak dijawab':q.opts[answer]||'Tidak dijawab';return `<article class="review-item"><div class="review-top"><strong>${String(i+1).padStart(2,'0')}. ${esc(q.q)}</strong><span class="review-tag ${got?'good':'bad'}">${got?'+5 POIN':'0 POIN'}</span></div><p class="review-answer"><b>Jawaban kamu:</b> ${esc(your)}</p><p class="review-answer"><b>Jawaban benar:</b> ${String.fromCharCode(65+q.correct)}. ${esc(q.opts[q.correct])}</p><p class="review-explanation">${esc(q.why)}</p></article>`}).join('')}</div><div class="review-actions"><button id="back-results" class="btn btn-dark">← KEMBALI KE HASIL</button><button id="review-board" class="btn btn-outline">LIHAT LEADERBOARD</button></div><div class="notice">Catatan konten: fitur ADAS dapat berbeda antarvarian dan pasar. Konfirmasi kelengkapan fitur unit Jimny 3-door MC 2027 Indonesia kepada tim Suzuki sebelum dipakai sebagai materi resmi.</div></section>`;document.getElementById('back-results').addEventListener('click',()=>goTo('results'));document.getElementById('review-board').addEventListener('click',()=>{screenBeforeBoard='review';goTo('leaderboard')})}
function renderLeaderboard(){stopTimer();screen='leaderboard';const sorted=sortRecords(attempts);const own=currentRecord?currentRecord.id:null;const backLabel=screenBeforeBoard==='landing'?'KEMBALI KE AWAL':screenBeforeBoard==='review'?'KEMBALI KE REVIEW':'KEMBALI KE HASIL';app.innerHTML=`<section class="panel"><div class="panel-head"><div><p class="section-kicker">Leaderboard</p><h2>Jimny Smart Ranking</h2><p>Skor tertinggi berada di urutan atas. Jika skor sama, peserta dengan waktu tercepat mendapat posisi lebih tinggi.</p></div><span class="db-chip">Database: ${esc(dbMode)}</span></div><div class="toolbar"><button id="export-csv" class="btn btn-dark">EXPORT CSV ↓</button><button id="export-json" class="btn btn-outline">BACKUP DATABASE ↓</button><button id="import-json" class="btn btn-outline">IMPORT DATABASE ↑</button></div><div class="table-wrap" style="margin-top:18px"><table class="leader-table"><thead><tr><th>Rank</th><th>Peserta / Media</th><th>Skor</th><th>Waktu</th><th>Selesai</th></tr></thead><tbody>${sorted.length?sorted.map((r,i)=>`<tr class="${r.id===own?'me':''}"><td class="rank-cell">${String(i+1).padStart(2,'0')}${i===0?' ★':''}</td><td><div class="leader-name">${esc(r.name)}</div><div class="leader-media">${esc(r.media)}</div></td><td class="score-cell">${Number(r.score)||0}<span style="color:#9aa394;font-weight:650"> / 100</span></td><td class="time-cell">${fmtTime(r.elapsedMs)}</td><td>${esc(fmtDate(r.completedAt))}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty-state">Belum ada peserta menyelesaikan quiz.<br>Leaderboard akan terisi setelah attempt pertama selesai.</div></td></tr>`}</tbody></table></div><div class="data-tools"><button id="back-from-board" class="btn btn-light">← ${backLabel}</button></div><p class="data-note"><strong>Penting:</strong> database ini lokal di browser/perangkat yang membuka file. Untuk menggabungkan hasil dari perangkat lain saat offline, ekspor file backup JSON dari masing-masing perangkat lalu impor ke satu perangkat utama. Peserta bernama + bermedia sama akan digabung dengan hasil terbaiknya. Leaderboard lintas perangkat secara otomatis memerlukan backend/server dan koneksi saat sinkronisasi.</p><p class="data-note">Ekspor CSV cocok untuk laporan. Backup JSON menyertakan jawaban peserta agar hasil dapat dipindahkan dan direview pada perangkat lain.</p></section>`;
 document.getElementById('export-csv').addEventListener('click',exportCSV);document.getElementById('export-json').addEventListener('click',exportJSON);document.getElementById('import-json').addEventListener('click',()=>importInput.click());document.getElementById('back-from-board').addEventListener('click',()=>goTo(screenBeforeBoard));
}
function exportJSON(){const data={app:'Jimny Smart Quiz',version:1,exportedAt:new Date().toISOString(),storageMode:dbMode,note:'Backup database lokal. Mengimpor file ini menggabungkan identitas yang sama dan mempertahankan skor terbaik.',attempts:sortRecords(attempts)};downloadFile('jimny-smart-quiz-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');showToast('Backup JSON berhasil disiapkan.')}
function csvCell(value){const s=String(value??'');return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){const sorted=sortRecords(attempts);const rows=[['Rank','Nama Peserta','Media','Skor','Waktu (detik)','Waktu (mm:ss)','Waktu Mulai','Waktu Selesai'],...sorted.map((r,i)=>[i+1,r.name,r.media,r.score,Math.round((r.elapsedMs||0)/1000),fmtTime(r.elapsedMs),r.startedAt||'',r.completedAt||''])];const csv='\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');downloadFile('jimny-smart-quiz-leaderboard-'+new Date().toISOString().slice(0,10)+'.csv',csv,'text/csv;charset=utf-8');showToast('CSV leaderboard berhasil disiapkan.')}
function downloadFile(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
importInput.addEventListener('change',async event=>{const file=event.target.files&&event.target.files[0];if(!file)return;try{const text=await file.text();const data=JSON.parse(text);const incoming=Array.isArray(data)?data:data.attempts;if(!Array.isArray(incoming))throw new Error('Format file tidak dikenal. Pilih backup JSON Jimny Smart Quiz.');const valid=incoming.filter(r=>r&&typeof r.name==='string'&&typeof r.media==='string'&&r.name.trim()&&r.media.trim()&&Number.isFinite(Number(r.score)));const merged=mergeById([...attempts,...valid]);const count=await replaceAll(merged);attempts=await getAllAttempts();showToast('Impor berhasil. Database sekarang berisi '+count+' identitas peserta.');renderLeaderboard()}catch(err){showToast('Impor gagal: '+err.message)}finally{importInput.value=''}});
function render(){if(screen==='landing')renderLanding();else if(screen==='quiz')renderQuiz();else if(screen==='results')renderResults();else if(screen==='review')renderReview();else if(screen==='leaderboard')renderLeaderboard()}
async function init(){await openDB();attempts=await getAllAttempts();const saved=loadActive();if(saved){const completed=attempts.some(a=>a.id===saved.id);if(!completed){active=saved;screen='quiz';renderQuiz();return}else safeLSRemove(ACTIVE_KEY)}renderLanding()}
init();
})();
</script>
</body>
</html>
